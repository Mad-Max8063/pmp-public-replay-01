name: Verify replay stage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q scripts normalize_status.py test_normalize_status.py verify_replay.py

      - name: Validate canonical memory
        run: python scripts/validate_memory.py PROJECT_MEMORY.md

      - name: Verify current replay stage
        run: python verify_replay.py
